server {
    listen 443 ssl;
    server_name 175.11.0.200;

    ssl_certificate /etc/nginx/certs/nginx-server.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-server.key;

    # Trust the legacy UAT CA and the portal certificate issuer during migration.
    ssl_client_certificate /etc/nginx/certs/uat-client-ca-bundle.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 1m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header ssl-client-verify $ssl_client_verify;
        proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
